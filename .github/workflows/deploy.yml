name: Deploy demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@12.2.0
      - run: npm ci
      - name: Validar dataset
        run: npm run validate:data
      - name: Build de producción
        env:
          PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}
          PLANETARY_API_BASE_URL: ${{ vars.PLANETARY_API_BASE_URL }}
        run: |
          if [[ "$PLANETARY_API_BASE_URL" != https://*/api/v1 ]]; then
            echo "::error::Set PLANETARY_API_BASE_URL to your FastAPI HTTPS URL ending in /api/v1."
            exit 1
          fi
          npm run build -- --base-href "/${{ github.event.repository.name }}/" --define "PLANETARY_API_BASE_URL='$PLANETARY_API_BASE_URL'"
      - name: Fallback para enlaces directos a rutas
        run: cp dist/frontend/browser/index.html dist/frontend/browser/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist/frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
