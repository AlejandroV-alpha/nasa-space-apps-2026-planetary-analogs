name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@12.2.0
      - run: npm ci
      - name: Verificar exportación científica reproducible
        run: python3 ../processing/export_frontend.py --check
      - name: Validar dataset contra el contrato
        run: npm run validate:data
      - name: Pruebas del validador
        run: npm run test:data
      - name: Pruebas unitarias
        run: npm test -- --watch=false
      - name: Build de desarrollo (no requiere licencia)
        run: npm run build:dev
      - name: Instalar Chromium para E2E
        run: npx playwright install --with-deps chromium
      - name: Pruebas E2E con respuestas controladas
        run: npx playwright test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/processing/requirements.txt
      - run: python -m pip install -r backend/requirements-dev.txt -r backend/processing/requirements.txt
      - name: Pruebas API y procesamiento científico
        run: python -m pytest backend/tests processing/tests -q
      - name: Compatibilidad de exportación anterior
        run: python processing/export_frontend.py --check
